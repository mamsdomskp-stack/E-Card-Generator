<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Summary</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-dark"><div class="container-fluid"><span class="navbar-brand">Card Summary</span><div><a class="btn btn-outline-light" href="/admin">Admin</a><a class="btn btn-outline-light ms-2" href="/logout">Logout</a></div></div></nav><div class="container py-4"><div class="card"><div class="table-responsive"><table class="table table-bordered mb-0"><thead><tr><th>Card</th>{% for status in statuses %}<th>{{status.replace('_',' ')|title}}</th>{% endfor %}</tr></thead><tbody>{% for card in cards %}<tr><th>{{card|title}}</th>{% for status in statuses %}<td>{{matrix[(card,status)]}}</td>{% endfor %}</tr>{% endfor %}</tbody></table></div></div></div></body></html>
